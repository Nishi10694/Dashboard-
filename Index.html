<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Indian Options Trader Dashboard</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

    <script src="https://s3.tradingview.com/tv.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0f1c 0%, #1a2338 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1500px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            color: #64b5f6;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 22px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 18px;
            color: #90caf9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: left;
        }

        .call {
            color: #81c784;
            font-weight: bold;
        }

        .put {
            color: #ef5350;
            font-weight: bold;
        }

        #momentumMap {
            position: relative;
            height: 400px;
            background: #101827;
            border-radius: 12px;
            overflow: hidden;
        }

        .sector-bubble {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <h1>Indian Options Trader Dashboard</h1>

        <button onclick="refreshData()">Refresh Data</button>

    </header>

    <div class="stats-grid"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

        <div class="card">

            <h2>Market Performance</h2>

            <table id="optionsTable"></table>

        </div>

        <div class="card">

            <h2>Momentum Map</h2>

            <div id="momentumMap"></div>

        </div>

    </div>

    <div class="card">

        <h2>Trade Ideas</h2>

        <table id="topStocksTable"></table>

    </div>

    <div class="card">

        <h2>Live TradingView Chart</h2>

        <div id="tradingview_chart" style="height:550px;"></div>

    </div>

</div>

<script>

const symbols = [

    { name: "NIFTY", yahoo: "^NSEI" },
    { name: "BANKNIFTY", yahoo: "^NSEBANK" },
    { name: "RELIANCE", yahoo: "RELIANCE.NS" },
    { name: "HDFCBANK", yahoo: "HDFCBANK.NS" },
    { name: "INFY", yahoo: "INFY.NS" },
    { name: "SBIN", yahoo: "SBIN.NS" }

];

let optionsData = [];

async function fetchYahooData(symbol) {

    try {

        const url =
        `https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/${symbol.yahoo}`;

        const response = await fetch(url);

        const data = await response.json();

        const result = data.chart.result[0];

        const closes = result.indicators.quote[0].close;

        const latest = closes[closes.length - 1];

        const prev = closes[closes.length - 2];

        const change = (((latest - prev) / prev) * 100).toFixed(2);

        return {
            stock: symbol.name,
            price: latest.toFixed(2),
            change: parseFloat(change),
            bias: change > 0 ? "CALL" : "PUT",
            strength: Math.abs(change) > 1 ? "Strong" : "Moderate"
        };

    } catch (error) {

        console.error(error);

        return null;
    }
}

async function loadMarketData() {

    optionsData = [];

    for (const symbol of symbols) {

        const stock = await fetchYahooData(symbol);

        if (stock) {
            optionsData.push(stock);
        }
    }

    renderStats();
    renderOptionsTable();
    renderTopStocks();
    renderMomentumMap();
}

function renderStats() {

    const statsGrid = document.querySelector(".stats-grid");

    statsGrid.innerHTML = optionsData.map(stock => `
        <div class="stat-card">
            <div class="stat-value" style="color:${stock.change >= 0 ? '#81c784' : '#ef5350'}">
                ${stock.price}
            </div>
            <div>${stock.stock}</div>
        </div>
    `).join("");
}

function renderOptionsTable() {

    const table = document.getElementById("optionsTable");

    let html = `
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Price</th>
                <th>Change %</th>
                <th>Bias</th>
                <th>Strength</th>
            </tr>
        </thead>
        <tbody>
    `;

    optionsData.forEach(stock => {

        html += `
            <tr>
                <td>${stock.stock}</td>
                <td>${stock.price}</td>
                <td>${stock.change}%</td>
                <td class="${stock.bias.toLowerCase()}">${stock.bias}</td>
                <td>${stock.strength}</td>
            </tr>
        `;
    });

    html += "</tbody>";

    table.innerHTML = html;
}

function renderTopStocks() {

    const table = document.getElementById("topStocksTable");

    let html = `
        <thead>
            <tr>
                <th>Stock</th>
                <th>Price</th>
                <th>Bias</th>
            </tr>
        </thead>
        <tbody>
    `;

    optionsData.forEach(stock => {

        html += `
            <tr>
                <td>${stock.stock}</td>
                <td>${stock.price}</td>
                <td class="${stock.bias.toLowerCase()}">${stock.bias}</td>
            </tr>
        `;
    });

    html += "</tbody>";

    table.innerHTML = html;
}

function renderMomentumMap() {

    const map = document.getElementById("momentumMap");

    map.innerHTML = "";

    optionsData.forEach((stock, index) => {

        const bubble = document.createElement("div");

        bubble.className = "sector-bubble";

        bubble.style.left = (15 + index * 12) + "%";
        bubble.style.top = (50 - stock.change * 8) + "%";
        bubble.style.width = "75px";
        bubble.style.height = "75px";
        bubble.style.background = stock.change >= 0 ? "#4caf50" : "#e53935";

        bubble.innerHTML = `
            <div>
                <div>${stock.stock}</div>
                <div>${stock.change}%</div>
            </div>
        `;

        map.appendChild(bubble);
    });
}

function refreshData() {
    loadMarketData();
}

loadMarketData();

setInterval(loadMarketData, 60000);

new TradingView.widget({
    "width": "100%",
    "height": 550,
    "symbol": "NSE:NIFTY",
    "interval": "15",
    "timezone": "Asia/Kolkata",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "container_id": "tradingview_chart"
});

</script>

</body>
</html>
